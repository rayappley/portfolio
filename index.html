<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Réka &amp; Dávid</title>
<meta name="description" content="Fotografía y video de viajes — portfolio de colaboración.">
<style>
  :root{
    --ground:#EEF1F2;
    --surface:#FFFFFF;
    --surface-2:#E3E8E9;
    --ink:#16242B;
    --muted:#5C6E75;
    --hair:#CDD6D8;
    --accent:#2E6670;
    --accent-soft:#3E7C86;
    --ember:#B4723C;
    --sky-top:#cfdadd;
    --sky-bot:#e9eef0;
    --mtn-far:#9aabb0;
    --mtn-mid:#6f858c;
    --mtn-near:#3f565d;
    --water:#b9c7cb;
    --shadow:0 1px 2px rgba(22,36,43,.06), 0 8px 30px rgba(22,36,43,.08);
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --ground:#0C1417;
      --surface:#132026;
      --surface-2:#1B2C33;
      --ink:#E9EFF0;
      --muted:#93A6AD;
      --hair:#27383F;
      --accent:#5FA8B2;
      --accent-soft:#79BCC5;
      --ember:#D08A54;
      --sky-top:#0e1b20;
      --sky-bot:#16262c;
      --mtn-far:#26383f;
      --mtn-mid:#32484f;
      --mtn-near:#16262c;
      --water:#11202560;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 34px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0C1417;
    --surface:#132026;
    --surface-2:#1B2C33;
    --ink:#E9EFF0;
    --muted:#93A6AD;
    --hair:#27383F;
    --accent:#5FA8B2;
    --accent-soft:#79BCC5;
    --ember:#D08A54;
    --sky-top:#0e1b20;
    --sky-bot:#16262c;
    --mtn-far:#26383f;
    --mtn-mid:#32484f;
    --mtn-near:#16262c;
    --water:#11202560;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 34px rgba(0,0,0,.45);
  }

  *{box-sizing:border-box}
  body{
    margin:0;background:var(--ground);color:var(--ink);
    font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding-inline:24px}
  h1,h2,h3{font-family:"Fraunces","Iowan Old Style",Georgia,serif;font-weight:500;text-wrap:balance;line-height:1.08;margin:0}
  p{margin:0}
  a{color:inherit}
  .eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .muted{color:var(--muted)}

  /* top bar */
  .topbar{position:sticky;top:0;z-index:20;backdrop-filter:blur(10px);
    background:color-mix(in srgb, var(--ground) 82%, transparent);
    border-bottom:1px solid var(--hair)}
  .topbar .wrap{display:flex;align-items:center;justify-content:space-between;padding-block:14px;gap:16px}
  .mark{font-family:"Fraunces",serif;font-size:19px;letter-spacing:.01em}
  .mark b{font-weight:600}
  .controls{display:flex;gap:8px;align-items:center}
  .btn{font:inherit;font-size:12.5px;letter-spacing:.04em;border:1px solid var(--hair);
    background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer;
    transition:border-color .15s, color .15s}
  .btn:hover{border-color:var(--accent)}
  .langtog{display:inline-flex;border:1px solid var(--hair);border-radius:999px;overflow:hidden;background:var(--surface)}
  .langtog button{font:inherit;font-size:12.5px;letter-spacing:.06em;border:0;background:transparent;color:var(--muted);
    padding:7px 13px;cursor:pointer}
  .langtog button[aria-pressed="true"]{background:var(--accent);color:#fff}
  :focus-visible{outline:2px solid var(--accent-soft);outline-offset:2px;border-radius:4px}

  /* hero */
  .hero{position:relative;overflow:hidden;border-bottom:1px solid var(--hair);height:clamp(400px,60vh,600px)}
  .hero svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .hero .heroimg{display:block;width:100%;height:100%;object-fit:cover;object-position:center 40%}
  .hero .scrim{position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(10,18,22,.05) 0%, rgba(10,18,22,.28) 55%, rgba(10,18,22,.62) 100%)}
  .hero .wrap{position:absolute;left:0;right:0;bottom:0;z-index:2}
  .hero .inner{position:relative;z-index:2;padding-block:0 48px;max-width:760px}
  .hero .eyebrow{color:#cfe6ea}
  .hero h1{color:#fff;font-size:clamp(44px,8.5vw,92px);letter-spacing:-.01em;margin-top:16px}
  .hero .sub{color:#e6eef0;font-size:clamp(16px,2.3vw,21px);margin-top:18px;max-width:48ch}
  .hero .meta{margin-top:26px;display:flex;flex-wrap:wrap;gap:10px}
  .chip{font-size:12.5px;letter-spacing:.04em;color:#eaf2f3;border:1px solid rgba(255,255,255,.4);
    border-radius:999px;padding:6px 13px}

  /* sections */
  section{padding-block:72px}
  .sechead{max-width:62ch;margin-bottom:36px}
  .sechead h2{font-size:clamp(28px,4vw,40px);margin-top:12px}
  .lead{font-size:19px;color:var(--muted);margin-top:14px;max-width:60ch}

  /* about */
  .about{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:start}
  .about .portrait{border-radius:6px;border:1px solid var(--hair);
    width:100%;height:auto;display:block;box-shadow:var(--shadow)}
  .slot-tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
    background:color-mix(in srgb,var(--ground) 70%, transparent);border:1px dashed var(--hair);
    border-radius:4px;padding:4px 8px}

  /* offer grid */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .offer{border:1px solid var(--hair);border-radius:6px;padding:22px;background:var(--surface);
    display:flex;flex-direction:column;gap:8px}
  .offer .n{font-family:"Fraunces",serif;font-size:15px;color:var(--accent)}
  .offer h3{font-size:20px}
  .offer p{font-size:14.5px;color:var(--muted)}

  /* gallery */
  .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;max-width:1120px;margin:0 auto}
  .g-item{position:relative;margin:0;width:100%;padding-top:100%;height:0;overflow:hidden;border-radius:0;cursor:zoom-in;background:var(--surface-2)}
  .g-item img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}
  .g-item .tag{position:absolute;left:8px;bottom:8px;z-index:2;margin:0;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.92);font-weight:500;pointer-events:none;padding:1.5px 3.5px;border-radius:3px;background:rgba(18,26,30,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  @media (max-width:540px){ .gallery{grid-template-columns:repeat(2,1fr)} }
  .lb{position:fixed;inset:0;background:rgba(8,12,14,.93);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;cursor:zoom-out}
  .lb.open{display:flex}
  .lb img{max-width:96vw;max-height:92vh;width:auto;height:auto;border-radius:4px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .lb .x{position:absolute;top:14px;right:20px;color:#fff;font-size:30px;line-height:1;background:none;border:0;cursor:pointer}
  .tile .cap{position:absolute;left:12px;bottom:12px;z-index:2;color:#eef4f5;font-size:12.5px;
    letter-spacing:.06em;text-transform:uppercase}
  .tile .cap small{display:block;text-transform:none;letter-spacing:0;opacity:.8;font-size:11px;margin-top:3px}
  .tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(8,16,20,.55))}

  /* steps */
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--hair);border-radius:8px;overflow:hidden}
  .step{padding:26px;border-right:1px solid var(--hair);background:var(--surface)}
  .step:last-child{border-right:0}
  .step .num{font-family:"Fraunces",serif;font-size:13px;letter-spacing:.1em;color:var(--accent);text-transform:uppercase}
  .step h3{font-size:20px;margin:10px 0 6px}
  .step p{font-size:14.5px;color:var(--muted)}

  .terms{margin-top:28px;display:flex;flex-wrap:wrap;gap:12px}
  .term{border:1px solid var(--hair);border-radius:6px;padding:12px 16px;background:var(--surface);font-size:14px}
  .term b{font-family:"Fraunces",serif;font-weight:600;color:var(--accent)}
  .pkg{margin-top:28px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .pkg-col{border:1px solid var(--hair);border-radius:8px;padding:22px 24px;background:var(--surface)}
  .pkg-col h4{font-family:"Fraunces",serif;font-weight:600;font-size:18px;margin:0 0 12px;color:var(--ink)}
  .pkg-opt h4{color:var(--accent)}
  .pkg-col ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
  .pkg-col li{position:relative;padding-left:20px;font-size:14.5px;color:var(--muted);line-height:1.5}
  .pkg-col li::before{content:"";position:absolute;left:2px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .pkg-note{margin-top:18px;font-size:13.5px;color:var(--muted);max-width:none;font-style:italic}
  .about-sub{margin:8px 0 0;font-size:13px;color:var(--muted);line-height:1.55;max-width:58ch}
  @media (max-width:760px){ .pkg{grid-template-columns:1fr} }

  /* contact */
  .contact{border-top:1px solid var(--hair);background:var(--surface)}
  .contact .inner{display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center}
  .contact h2{font-size:clamp(28px,4vw,40px)}
  .maillink{display:inline-block;margin-top:18px;font-family:"Fraunces",serif;font-size:clamp(22px,3.4vw,30px);
    color:var(--ink);text-decoration:none;border-bottom:2px solid var(--accent);padding-bottom:3px}
  .maillink:hover{color:var(--accent)}
  .socials{display:flex;flex-direction:column;gap:10px;font-size:14.5px}
  .socials .row{display:flex;gap:10px;align-items:center;color:var(--muted)}
  .socials .row b{color:var(--ink);font-weight:600}
  .socials a{color:var(--accent);text-decoration:none}
  .socials a:hover{text-decoration:underline}

  footer{padding-block:34px;color:var(--muted);font-size:13px;text-align:center}

  [lang-hide]{display:none !important}

  @media (max-width:760px){
    .about,.contact .inner{grid-template-columns:1fr;gap:28px}
    .grid,.steps{grid-template-columns:1fr}
    .steps{border-radius:8px}
    .step{border-right:0;border-bottom:1px solid var(--hair)}
    .step:last-child{border-bottom:0}
    .hero .inner{padding-block:0 40px}
  }
  @media (prefers-reduced-motion:no-preference){
    .btn,.langtog button,.maillink{transition:all .18s ease}
  }

  .idea-extra{margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .video-p{font-size:14.5px;color:var(--muted);line-height:1.55;margin:0}
  .close{text-align:center;padding-block:64px}
  .close h2{font-size:clamp(28px,4vw,40px)}
  .close .lead{margin:14px auto 0}
  .close-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}
  .btn-cta{font-family:"Archivo",system-ui,sans-serif;font-size:14px;letter-spacing:.02em;text-decoration:none;padding:11px 22px;border-radius:999px;background:var(--accent);color:#fff;border:1px solid var(--accent)}
  .btn-cta.ghost{background:transparent;color:var(--accent)}
  .btn-cta:hover{opacity:.9}
  @media (max-width:760px){ .idea-extra{grid-template-columns:1fr} }
  .close-meta{margin-top:26px;display:flex;flex-direction:column;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
  .close-meta b{color:var(--ink);font-weight:600}
  .close-meta a{color:var(--accent);text-decoration:none}
  .close-meta a:hover{text-decoration:underline}
  .hero-cta{margin-top:22px}
  .ba{position:relative;width:100%;max-width:900px;margin:24px auto 0;aspect-ratio:3/2;overflow:hidden;border-radius:6px;border:1px solid var(--hair);user-select:none;touch-action:pan-y;background:var(--surface-2)}
  .ba .ba-img{position:absolute;inset:0;color:#fff;background-size:cover;background-position:center}
  .ba .ba-img span{position:absolute;top:12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:rgba(12,18,22,.62);padding:5px 11px;border-radius:999px;white-space:nowrap;box-shadow:0 1px 5px rgba(0,0,0,.3)}
  .ba .ba-after span{right:12px}
  .ba .ba-before span{left:12px}
  .ba .ba-after{background:linear-gradient(135deg,#34505a,#7f9aa1)}
  .ba .ba-clip{position:absolute;inset:0;width:50%;overflow:hidden}
  .ba .ba-before{background:linear-gradient(135deg,#4b4b4b,#8c8c8c);filter:saturate(.55)}
  .ba .ba-line{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#fff;transform:translateX(-1px);pointer-events:none}
  .ba .ba-handle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 10px rgba(0,0,0,.35);cursor:ew-resize;font-size:18px;color:var(--ink);display:flex;align-items:center;justify-content:center;z-index:2}
  .ba-thumbs{display:flex;gap:8px;justify-content:center;margin:12px auto 0;max-width:900px}
  .ba-thumb{width:78px;height:78px;flex:0 0 auto;border-radius:5px;border:2px solid transparent;padding:0;cursor:pointer;background:var(--surface-2);background-size:cover;background-position:center;opacity:.55;transition:opacity .15s,border-color .15s,transform .15s;position:relative;overflow:hidden}
  .ba-thumb:hover{opacity:.85}
  .ba-thumb.is-active{opacity:1;border-color:var(--accent);transform:translateY(-1px)}
  .ba-thumb .n{position:absolute;left:6px;bottom:5px;font-size:11px;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.65)}
  @media (max-width:480px){ .ba-thumb{width:64px;height:64px} }
  .ba-cap{text-align:center;font-size:13px;color:var(--muted);margin:10px 0 0}
  .ba-cap b{color:var(--ink);font-family:"Fraunces",serif;font-weight:600}
  .work-cards{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:24px}
  .work-card{display:flex;flex-direction:column;text-decoration:none;color:inherit;border:1px solid var(--hair);border-radius:8px;overflow:hidden;background:var(--surface);transition:transform .18s,box-shadow .18s,border-color .18s}
  .work-card:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.14);border-color:var(--accent-soft)}
  .work-thumb{aspect-ratio:4/3;background-size:cover !important;background-position:center}
  .work-body{padding:20px 22px 24px}
  .work-body h3{font-family:"Fraunces",serif;font-weight:600;font-size:23px;margin:0 0 8px;color:var(--ink)}
  .work-body p{font-size:15px;color:var(--muted);margin:0 0 16px;line-height:1.55}
  .work-cta{font-size:14px;font-weight:600;color:var(--accent)}
  .work-card:hover .work-cta{text-decoration:underline}
  .subpage{display:block}
  .subpage[hidden]{display:none}
  #view-main[hidden]{display:none}
  .back-link{display:inline-block;margin:6px 0 20px;font-size:14px;color:var(--muted);text-decoration:none}
  .back-link:hover{color:var(--ink)}
  .feat-grid.feat-grid-lg{grid-template-columns:repeat(5,1fr)}
  @media (max-width:900px){ .feat-grid.feat-grid-lg{grid-template-columns:repeat(3,1fr)} }
  @media (max-width:520px){ .feat-grid.feat-grid-lg{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:760px){ .work-cards{grid-template-columns:1fr} }
  .feat-sub{font-family:"Fraunces",serif;font-weight:600;font-size:19px;margin:34px 0 6px}
  .feat-tap{font-size:13px;color:var(--muted);margin:0 0 14px}
  .feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .ph-tile{margin:0;aspect-ratio:1/1;border:1px dashed var(--hair);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-align:center;background:var(--surface-2);padding:6px}
  .testi{margin:30px auto 0;max-width:60ch;text-align:center;border-top:1px solid var(--hair);padding-top:24px}
  .testi p{font-family:"Fraunces",serif;font-size:20px;font-style:italic;color:var(--ink);margin:0}
  .testi cite{display:block;margin-top:10px;font-size:14px;color:var(--muted);font-style:normal}
  .testimonial{max-width:860px;margin:0 auto;background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:clamp(30px,5vw,54px) clamp(22px,5vw,56px);text-align:center}
  .testimonial .eyebrow{margin-bottom:20px}
  .tquote{margin:0;position:relative}
  .tquote .qmark{font-family:"Fraunces",serif;font-size:64px;line-height:.5;color:var(--accent);opacity:.4;display:block;margin-bottom:6px}
  .tquote p{font-family:"Fraunces",serif;font-weight:500;font-style:italic;font-size:clamp(19px,2.4vw,26px);line-height:1.5;color:var(--ink);margin:0 auto;max-width:46ch}
  .tquote cite{display:block;margin-top:24px;font-style:normal;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .idea-style{margin-top:16px;font-size:15px;color:var(--ink);max-width:62ch;border-left:2px solid var(--accent);padding-left:14px}
  .next-cols{display:grid;grid-template-columns:1fr;gap:28px;margin-top:6px}
  .next-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
  .next-list li{font-size:15px;color:var(--ink);border-bottom:1px solid var(--hair);padding-bottom:10px}
  .stayed h4{font-family:"Fraunces",serif;font-weight:600;font-size:16px;margin:0 0 10px;color:var(--ink)}
  .pkg-paid{margin-top:10px}
  @media (max-width:760px){ .feat-grid{grid-template-columns:repeat(2,1fr)} .next-cols{grid-template-columns:1fr} .ba{aspect-ratio:4/5} }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap">
</head>
<body>
<div class="topbar">
  <div class="wrap">
    <div class="mark">Réka <span class="muted">&amp;</span> <b>Dávid</b></div>
    <div class="controls">
      <div class="langtog" role="group" aria-label="Language" translate="no">
        <button data-lang="es" aria-pressed="true" translate="no">ES</button>
        <button data-lang="en" aria-pressed="false" translate="no">EN</button>
      </div>
      <button class="btn" id="themeBtn" aria-label="Tema">◐</button>
    </div>
  </div>
</div>

<main id="view-main">
<!-- HERO -->
<header class="hero">
  <img class="heroimg" src="images/img-01-b7700191a0.jpg" alt="">

  <div class="scrim"></div>
  <div class="wrap">
    <div class="inner">
      <p class="eyebrow">
        <span data-t="hero.eyebrow"></span>
      </p>
      <h1 data-t="hero.title"></h1>
      <p class="sub" data-t="hero.sub"></p>
      <div class="hero-cta"><a class="btn-cta" href="#contact" data-t="hero.cta"></a></div>
    </div>
  </div>
</header>

<!-- ABOUT -->
<section class="wrap">
  <div class="about">
    <div>
      <p class="eyebrow" data-t="about.eyebrow"></p>
      <h2 style="font-size:clamp(26px,4vw,38px);margin-top:12px" data-t="about.title"></h2>
      <p class="about-sub" data-t="about.subtitle"></p>
      <p class="lead" data-t="about.p1"></p>
    </div>
    <img class="portrait" src="images/img-02-911784860b.jpg" alt="Réka &amp; Dávid">

  </div>
</section>

<!-- RECENT WORK -->
<section class="wrap feat">
  <div class="sechead">
    <p class="eyebrow" data-t="feat.eyebrow"></p>
    <h2 data-t="feat.title"></h2>
    <p class="lead" data-t="feat.story"></p>
  </div>
  <div class="work-cards">
    <a class="work-card" href="#work/cabanas" data-go="cab">
      <div class="work-thumb" style="background-image:url(images/cabin-cover.jpg)"></div>
      <div class="work-body">
        <h3 data-t="feat.tab.cab"></h3>
        <p data-t="feat.cab.card"></p>
        <span class="work-cta" data-t="feat.card.cta"></span>
      </div>
    </a>
    <a class="work-card" href="#work/apartments" data-go="apt">
      <div class="work-thumb" style="background-image:url(images/apt-cover.jpg)"></div>
      <div class="work-body">

function applyLang(lang){
  const dict = T[lang] || T.es;
  const ovr = window.__ovr || {};
  document.querySelectorAll("[data-t]").forEach(el=>{
    const k = el.getAttribute("data-t");
    const o = ovr[k];
    if(o && o[lang]!==undefined && o[lang]!=="") el.textContent = o[lang];
    else if(dict[k]!==undefined) el.textContent = dict[k];
  });
  document.documentElement.setAttribute("lang", lang);
  document.querySelectorAll(".langtog button").forEach(b=>{
    b.setAttribute("aria-pressed", b.dataset.lang===lang ? "true":"false");
  });
  try{ localStorage.setItem("rd_lang", lang); }catch(e){}
}
document.querySelectorAll(".langtog button").forEach(b=>{
  b.addEventListener("click", ()=>applyLang(b.dataset.lang));
});
let startLang = "es";
try{ const s = localStorage.getItem("rd_lang"); if(s==="en"||s==="es") startLang=s; }catch(e){}
applyLang(startLang);

// theme toggle
const root = document.documentElement;
function currentTheme(){
  const attr = root.getAttribute("data-theme");
  if(attr) return attr;
  return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark":"light";
}
document.getElementById("themeBtn").addEventListener("click", ()=>{
  const next = currentTheme()==="dark" ? "light":"dark";
  root.setAttribute("data-theme", next);
  try{ localStorage.setItem("rd_theme", next); }catch(e){}
});
try{ const th = localStorage.getItem("rd_theme"); if(th==="dark"||th==="light") root.setAttribute("data-theme", th); }catch(e){}

<div class="lb" id="lb"><button class="x" aria-label="Cerrar">&times;</button><img alt=""></div>
<script>
(function(){
  var g=document.querySelector('.gallery');
  // ----- text overrides (persist locally; bake via export) -----
  var TXTk='rd_text_v18';
  function loadTxt(){ try{return JSON.parse(localStorage.getItem(TXTk))||{}}catch(e){return {};} }
  function saveTxt(){ try{localStorage.setItem(TXTk, JSON.stringify(window.__ovr||{}));}catch(e){} }
  window.__ovr=loadTxt();
  function curLang(){ return document.documentElement.getAttribute('lang')||'es'; }
  if(typeof applyLang==='function') applyLang(curLang());

  // ----- gallery order/tags (local preview) -----
  var LSk='rd_gallery_v15';
  function loadG(){ try{return JSON.parse(localStorage.getItem(LSk))||{}}catch(e){return {};} }
  function saveG(o){ try{localStorage.setItem(LSk, JSON.stringify(o));}catch(e){} }
  var gs=loadG();
  if(g){
    var byId={}; [].slice.call(g.children).forEach(function(f){byId[f.dataset.id]=f;});
    if(gs.order){ gs.order.forEach(function(id){ if(byId[id]) g.appendChild(byId[id]); }); }
    if(gs.tags){ Object.keys(gs.tags).forEach(function(id){ var f=byId[id]; if(f){var t=f.querySelector('.tag'); if(t){ t.setAttribute('data-t', gs.tags[id]); } } }); if(typeof applyLang==='function') applyLang(curLang()); }
  }

  // ----- lightbox -----
  var lb=document.getElementById('lb'), lbimg=lb.querySelector('img');
  if(g) g.addEventListener('click',function(e){ if(document.body.classList.contains('editing')) return; var f=e.target.closest('.g-item'); if(!f)return; lbimg.src=f.querySelector('img').src; lb.classList.add('open'); });
  [].slice.call(document.querySelectorAll('.feat-grid')).forEach(function(fg){ fg.addEventListener('click',function(e){ if(document.body.classList.contains('editing')) return; var f=e.target.closest('.g-item'); if(!f)return; var im=f.querySelector('img'); if(!im)return; lbimg.src=im.src; lb.classList.add('open'); }); });
  lb.addEventListener('click',function(){lb.classList.remove('open'); lbimg.src='';});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){lb.classList.remove('open'); lbimg.src='';}});

  if(!/edit/i.test(location.hash)) return;
  document.body.classList.add('editing');
  // edit mode is English so you edit English; Spanish auto-translates on save
  if(typeof applyLang==='function') applyLang('en');
  document.querySelectorAll('.langtog button').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.lang==='en'?'true':'false'); });

  var bar=document.createElement('div'); bar.className='editbar';
  bar.innerHTML='<b>Szerkeszto mod (EN)</b><span>kattints barmelyik szovegre es ird at angolul - a spanyol automatikusan lefordul menteskor</span><span class="st" id="ebSt"></span><span class="sp"></span><button id="ebCopy">Osszes valtozas masolasa</button><button id="ebReset">Visszaallitas</button>';
  document.body.appendChild(bar);
  var st=document.getElementById('ebSt');
  function status(m){ st.textContent=m||''; }

  // ----- translation via sample capability -----
  var _sample;
  async function getSample(){ if(_sample!==undefined) return _sample; _sample=null; try{ if(window.claude&&claude.use){ _sample=await claude.use('sample'); } }catch(e){ _sample=null; } return _sample; }
  async function translate(en){ var s=await getSample(); if(!s) return null; try{ var r=await s('Translate this text from a photographer duo’s pitch page into natural, warm European Spanish (Latin-American-friendly). Keep it concise, preserve punctuation and any dashes. Return ONLY the Spanish translation, no quotes:\n\n'+en,{modelTier:'quick',cache:true}); return ((r&&r.text)||'').trim(); }catch(e){ return null; } }

  // ----- inline text editing -----
  var warned=false;
  var fields=[].slice.call(document.querySelectorAll('[data-t]')).filter(function(el){ return !el.classList.contains('tag') && !el.closest('.langtog') && !el.closest('.editbar'); });
  fields.forEach(function(el){
    var key=el.getAttribute('data-t');
    el.setAttribute('contenteditable','true');
    el.setAttribute('spellcheck','false');
    el.addEventListener('keydown',function(e){ if(e.key==='Enter' && el.tagName!=='P' && !e.shiftKey){ e.preventDefault(); el.blur(); } });
    el.addEventListener('blur',async function(){
      var en=el.textContent.replace(/\s+/g,' ').trim();
      var baseEn=(T.en[key]!==undefined?T.en[key]:'');
      var o=window.__ovr[key];
      if(en===baseEn && !o){ return; }            // unchanged
      if(o && o.en===en){ return; }                // already saved same
      window.__ovr[key]=window.__ovr[key]||{}; window.__ovr[key].en=en; saveTxt();
      el.classList.add('translating'); status('Forditas spanyolra…');
      var es=await translate(en);
      el.classList.remove('translating');
      if(es){ window.__ovr[key].es=es; saveTxt(); status('Kesz: '+es.slice(0,40)+(es.length>40?'…':'')); }
      else { window.__ovr[key].es=en; saveTxt(); status('Nincs forditas (spanyol = angol egyelore)'); if(!warned){ warned=true; alert('A spanyol automatikus forditashoz engedelyezned kell a Claude-kerdest (felugro). Ha nem jon elo, akkor is menti angolul; a veglegesitesnel en leforditom.'); } }
    });
  });

  // ----- gallery drag reorder -----
  if(g){
    var dragEl=null;
    function curOrder(){ return [].slice.call(g.children).map(function(f){return f.dataset.id;}); }
    function persistOrder(){ gs.order=curOrder(); saveG(gs); }
    [].slice.call(g.children).forEach(function(f){
      f.setAttribute('draggable','true');
      f.addEventListener('dragstart',function(e){dragEl=f; f.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text','x');}catch(_){}} );
      f.addEventListener('dragend',function(){f.classList.remove('dragging'); dragEl=null; persistOrder();});
      f.addEventListener('dragover',function(e){e.preventDefault(); var t=e.target.closest('.g-item'); if(!t||t===dragEl)return; var r=t.getBoundingClientRect(); var after=((e.clientY-r.top)+(e.clientX-r.left))>((r.height+r.width)/2); g.insertBefore(dragEl, after? t.nextSibling : t);});
    });
  }

  document.getElementById('ebCopy').addEventListener('click',function(){
    var out={text:window.__ovr||{}};
    if(g){ out.order=[].slice.call(g.children).map(function(f){return f.dataset.id;}); out.tags={}; [].slice.call(g.children).forEach(function(f){var t=f.querySelector('.tag'); if(t) out.tags[f.dataset.id]=t.getAttribute('data-t')||t.textContent.trim();}); }
    var s=JSON.stringify(out);
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(s).then(function(){alert('Minden valtozas a vagolapon - kuldd el Claude-nak a beegeteshez.');},function(){prompt('Masold ki:',s);}); }
    else prompt('Masold ki:',s);
  });
  document.getElementById('ebReset').addEventListener('click',function(){ try{localStorage.removeItem(TXTk); localStorage.removeItem(LSk);}catch(e){} location.reload(); });
})();
</script>

<script>
(function(){
  // Before/after pairs per project. Drop the real photos into b (old listing) and
  // a (our work) as data: URIs or URLs; bg_b/bg_a are placeholder gradients until then.
  var CAB=[
    {b:'images/img-51-b568ca1326.jpg', a:'images/img-52-10c032118c.jpg', bg_b:'linear-gradient(135deg,#4b4b4b,#8c8c8c)', bg_a:'linear-gradient(135deg,#34505a,#7f9aa1)'}
  ];
  var APT=[
    {b:'', a:'', bg_b:'linear-gradient(135deg,#45454f,#8a8a95)', bg_a:'linear-gradient(135deg,#38546a,#7f9db2)'}
  ];
  function bgFor(p,which){ var img=which==='a'?p.a:p.b; return img?('url('+img+')'):(which==='a'?p.bg_a:p.bg_b); }
  function initBA(slider, pairs){
    if(!slider) return null;
    var afterEl=slider.querySelector('.ba-after'), before=slider.querySelector('.ba-before');
    var clip=slider.querySelector('.ba-clip'), line=slider.querySelector('.ba-line'), handle=slider.querySelector('.ba-handle');
    var thumbsWrap=slider.parentNode.querySelector('.ba-thumbs');
    function sizeBefore(){ before.style.width=slider.clientWidth+'px'; }
    function setPos(px){ var w=slider.clientWidth; if(!w) return; px=Math.max(0,Math.min(w,px)); clip.style.width=px+'px'; line.style.left=px+'px'; handle.style.left=px+'px'; }
    function center(){ sizeBefore(); setPos(slider.clientWidth/2); }
    var thumbs=[];
    function select(i){ var p=pairs[i]; if(!p) return;
      afterEl.style.backgroundImage=bgFor(p,'a'); before.style.backgroundImage=bgFor(p,'b');
      thumbs.forEach(function(t,k){ var on=(k===i); t.classList.toggle('is-active',on); t.setAttribute('aria-selected',on?'true':'false'); });
      center();
    }
    if(thumbsWrap){
      thumbsWrap.innerHTML='';
      if(pairs.length>1){
        pairs.forEach(function(p,k){
          var btn=document.createElement('button'); btn.type='button'; btn.className='ba-thumb'+(k===0?' is-active':'');
          btn.setAttribute('aria-label',String(k+1)); btn.style.backgroundImage=bgFor(p,'a');
          var n=document.createElement('span'); n.className='n'; n.textContent=String(k+1); btn.appendChild(n);
          btn.addEventListener('click',function(){ select(k); });
          thumbsWrap.appendChild(btn); thumbs.push(btn);
        });
      } else { thumbsWrap.style.display='none'; }
    }
    select(0);
    var drag=false;
    function fromE(e){ var r=slider.getBoundingClientRect(); var cx=(e.touches&&e.touches[0])?e.touches[0].clientX:e.clientX; setPos(cx-r.left); }
    slider.addEventListener('mousedown',function(e){drag=true;fromE(e);e.preventDefault();});
    window.addEventListener('mousemove',function(e){if(drag)fromE(e);});
    window.addEventListener('mouseup',function(){drag=false;});
    slider.addEventListener('touchstart',function(e){drag=true;fromE(e);},{passive:true});
    slider.addEventListener('touchmove',function(e){if(drag){fromE(e);e.preventDefault();}},{passive:false});
    window.addEventListener('touchend',function(){drag=false;});
    return { center: center };
  }
  var apis={};
  apis.cab=initBA(document.getElementById('ba_cab'), CAB);
  apis.apt=initBA(document.getElementById('ba_apt'), APT);
  var main=document.getElementById('view-main'), vcab=document.getElementById('view-cab'), vapt=document.getElementById('view-apt');
  var HASH={cab:'work/cabanas', apt:'work/apartments'};
  function showView(key){
    if(main) main.hidden = !!key;
    if(vcab) vcab.hidden = (key!=='cab');
    if(vapt) vapt.hidden = (key!=='apt');
    try{ var want=key?HASH[key]:''; var cur=(location.hash||'').replace(/^#/,''); if(cur!==want){ location.hash=want; } }catch(e){}
    window.scrollTo(0,0);
    if(key && apis[key]) apis[key].center();
  }
  function keyFromHash(){ var h=(location.hash||'').replace(/^#/,''); return h==='work/cabanas'?'cab':(h==='work/apartments'?'apt':''); }
  Array.prototype.slice.call(document.querySelectorAll('[data-go]')).forEach(function(el){
    el.addEventListener('click',function(e){ e.preventDefault(); showView(el.getAttribute('data-go')||''); });
  });
  window.addEventListener('hashchange',function(){ showView(keyFromHash()); });
  window.addEventListener('resize',function(){ Object.keys(apis).forEach(function(k){ if(apis[k]) apis[k].center(); }); });
  showView(keyFromHash());
})();
</script>
